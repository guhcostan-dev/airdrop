name: Backup D1

# Weekly SQL export of the production database to R2 (airdrop-assets/backups/), expired after
# 35 days by a bucket lifecycle rule. D1 Time Travel also allows point-in-time restore
# (see docs/operations.md). Secret: CLOUDFLARE_API_TOKEN (D1 + R2 edit).
on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

concurrency:
  group: backup-d1
  cancel-in-progress: false

jobs:
  backup:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export and upload
        working-directory: apps/server
        run: |
          FILE="$RUNNER_TEMP/airdrop-$(date -u +%Y%m%dT%H%M%SZ).sql"
          npx wrangler d1 export airdrop --remote --output "$FILE"
          test -s "$FILE"
          gzip -9 "$FILE"
          npx wrangler r2 object put "airdrop-assets/backups/$(basename "$FILE").gz" --file "$FILE.gz" --remote
          rm -f "$FILE.gz"
      - name: Ensure backups expire after 35 days
        working-directory: apps/server
        run: |
          npx wrangler r2 bucket lifecycle list airdrop-assets | grep -q "expire-backups" || \
            npx wrangler r2 bucket lifecycle add airdrop-assets expire-backups backups/ --expire-days 35 --force
